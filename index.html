<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's That Monster?</title>
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background-color: #1a1c29; 
            font-family: 'Arial Black', '微軟正黑體', sans-serif;
            color: #fff;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        #bg-image {
            width: 100%;
            display: block;
        }

        #display-canvas {
            position: absolute;
            top: 22%;    
            left: 11.5%; 
            width: 37.5%;  
            height: 38%; 
            object-fit: contain; 
            z-index: 5;
            transition: opacity 0.3s ease;
        }

        #original-img {
            display: none;
        }

        #pokedex-info {
            display: none; 
            width: 90%;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ffcc00;
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .type-badge {
            display: inline-block;
            background-color: #ff3333;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        #pokedex-info p {
            margin: 8px 0;
            font-family: sans-serif;
            font-size: 1rem;
            line-height: 1.5;
        }

        .desc-text {
            margin-top: 15px !important;
            padding-top: 15px;
            border-top: 1px dashed rgba(255,255,255,0.3);
            font-style: italic;
            color: #ddd;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            z-index: 10;
        }

        input[type="file"], button {
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #upload-btn {
            background-color: #f4f4f4;
            color: #333;
        }

        #reveal-btn {
            background-color: #ff3333;
            color: white;
            display: none; 
        }

        #reveal-btn:active {
            transform: scale(0.95);
        }
        
        #loading-text {
            font-size: 1.2rem;
            color: #ffcc00;
            margin-top: 10px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <img id="bg-image" src="bg.jpg" alt="Who is that">
        <canvas id="display-canvas"></canvas>
    </div>

    <div id="loading-text">Gemini 大師正在分析神秘圖騰中...</div>

    <div id="pokedex-info">
        <div class="type-badge" id="monster-type">屬性</div>
        <p><strong>特性：</strong><span id="monster-ability"></span></p>
        <p><strong>身高：</strong><span id="monster-height"></span> m &nbsp;&nbsp;|&nbsp;&nbsp; <strong>體重：</strong><span id="monster-weight"></span> kg</p>
        <p class="desc-text" id="monster-desc"></p>
    </div>

    <img id="original-img" src="" alt="hidden original">

    <div class="controls">
        <input type="file" id="upload-btn" accept="image/*">
        <button id="reveal-btn">AI 圖鑑解析完成！點擊揭曉！</button>
    </div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6LPCt3QOSvv1DYiRtZxaITMYzEuYUwXzs8WVF_gew7U_Q";
        const GEMINI_API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";

        const uploadBtn = document.getElementById('upload-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const loadingText = document.getElementById('loading-text');
        const canvas = document.getElementById('display-canvas');
        const ctx = canvas.getContext('2d');
        const originalImg = document.getElementById('original-img');
        const pokedexInfo = document.getElementById('pokedex-info');

        window.monsterData = null;

        uploadBtn.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            pokedexInfo.style.display = 'none';
            revealBtn.style.display = 'none';

            const reader = new FileReader();
            reader.onload = function(event) {
                // 💡 關鍵修正點：必須先綁定 onload 事件，才能把 src 放進去！
                originalImg.onload = function() {
                    processMonsterWorkflow();
                };
                originalImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function processMonsterWorkflow() {
            // 確保所有維度尺寸皆為嚴格整數，消除浮點數引發的陣列邊界不對齊問題
            let width = Math.floor(originalImg.width);
            let height = Math.floor(originalImg.height);
            const targetDim = 500; 
            
            if (width > targetDim || height > targetDim) {
                if (width > height) {
                    height = Math.floor((targetDim / width) * height);
                    width = targetDim;
                } else {
                    width = Math.floor((targetDim / height) * width);
                    height = targetDim;
                }
            }

            canvas.width = width;
            canvas.height = height;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');

            // 輕微膨脹邊界以閉合小朋友線條中微小的縫隙
            for (let dx = -1; dx <= 1; dx++) {
                for (let dy = -1; dy <= 1; dy++) {
                    tempCtx.drawImage(originalImg, dx, dy, width, height);
                }
            }

            let imgData = tempCtx.getImageData(0, 0, width, height);
            let pixels = imgData.data;
            
            let grid = new Uint8Array(width * height);
            for (let i = 0; i < pixels.length; i += 4) {
                const brightness = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                const alpha = pixels[i + 3];
                if (alpha > 50 && brightness < 220) {
                    grid[i / 4] = 1; 
                } else {
                    grid[i / 4] = 0; 
                }
            }

            let stack = [];
            const w = width;
            const h = height;

            const corners = [0, w - 1, (h - 1) * w, h * w - 1];
            corners.forEach(idx => {
                if (grid[idx] === 0) {
                    grid[idx] = 2; 
                    stack.push(idx);
                }
            });

            while (stack.length > 0) {
                let idx = stack.pop();
                let currX = idx % w;
                let currY = Math.floor(idx / w);

                const directions = [
                    {x: currX, y: currY - 1}, {x: currX, y: currY + 1},
                    {x: currX - 1, y: currY}, {x: currX + 1, y: currY}
                ];

                for (let dir of directions) {
                    if (dir.x >= 0 && dir.x < w && dir.y >= 0 && dir.y < h) {
                        let nextIdx = dir.y * w + dir.x;
                        if (grid[nextIdx] === 0) {
                            grid[nextIdx] = 2; 
                            stack.push(nextIdx);
                        }
                    }
                }
            }

            let finalImgData = ctx.createImageData(w, h);
            let finalPixels = finalImgData.data;
            for (let i = 0; i < grid.length; i++) {
                let rIdx = i * 4;
                if (grid[i] === 2) {
                    finalPixels[rIdx + 3] = 0;
                } else {
                    finalPixels[rIdx] = 21;     
                    finalPixels[rIdx + 1] = 24; 
                    finalPixels[rIdx + 2] = 36; 
                    finalPixels[rIdx + 3] = 255; 
                }
            }
            ctx.putImageData(finalImgData, 0, 0);

            uploadBtn.style.display = 'none'; 
            loadingText.style.display = 'block';
            loadingText.innerText = "Gemini 大師正在分析神秘圖騰中...";

            // 建立乾淨白底畫布，避免傳送全黑圖片給 AI 導致 503 錯誤
            const aiCanvas = document.createElement('canvas');
            aiCanvas.width = width;
            aiCanvas.height = height;
            const aiCtx = aiCanvas.getContext('2d');
            aiCtx.fillStyle = "#FFFFFF"; 
            aiCtx.fillRect(0, 0, width, height);
            aiCtx.drawImage(originalImg, 0, 0, width, height); 
            const cleanBase64 = aiCanvas.toDataURL("image/jpeg", 0.8).split(',')[1];

            const promptText = `你是一位資深的寶可夢生態學家，在玉虹市（Celadon City）大學擔任教授。請觀察附帶圖片，這是一個剛被發現的神秘生命體。
            請根據圖片中的生物特徵，嚴格依照以下 JSON 格式建立合理的、充滿幻想與寶可夢世界設定的生態圖鑑資料。
            絕對禁止提及：1. 這是條線或塗鴉。2. 這是人類孩童畫的。3. 關於繪畫風格、字跡、白紙背景、表情符號等文字。
            act as if you are observing a living, biological creature in the wild via advanced scanning technology.
            文案要融入神話、遠古壁畫、地形交互習慣、或者不為人知的特異機制。
            欄位必須包含（繁體中文）：
            {
                "name": "怪獸名稱(結合外型特徵與屬性諧音，避免公版名稱)",
                "category": "分類(如：天線寶可夢、重甲寶可夢、神秘忠犬寶可夢)",
                "type": "屬性組合(1~2個屬性，必須邏輯上符合視覺特徵)",
                "ability": "特性名稱(1個符合特徵的特性)",
                "height": 數字(合理的身高，單位公尺),
                "weight": 數字(合理的體重),
                "moves": ["招式1", "招式2", "罕見招式"],
                "description": "約120字偽科學、帶有幻想與傳說色彩的生態描述。請描述牠覓食時的奇特機制、情緒高漲時身體（如耳朵或尾巴）會有什麼不為人知的變化、或者與古代遺跡的神秘關聯。讓文案讀起來像官方圖鑑。"
            }`;

            fetch(GEMINI_API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-goog-api-key': GEMINI_API_KEY  
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inlineData: { mimeType: "image/jpeg", data: cleanBase64 } }
                        ]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
                }
                return response.json();
            })
            .then(result => {
                const jsonText = result.candidates[0].content.parts[0].text;
                window.monsterData = JSON.parse(jsonText); 
                
                loadingText.style.display = 'none';
                revealBtn.style.display = 'block'; 
            })
            .catch(error => {
                console.error("API 發生錯誤:", error);
                loadingText.innerText = "分析大師暫時斷線，請檢查金鑰或網路。";
            });
        }

        revealBtn.addEventListener('click', function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);

            const data = window.monsterData;

            if (data) {
                document.getElementById('monster-type').innerText = data.type + ' / ' + data.category;
                document.getElementById('monster-ability').innerText = data.ability;
                document.getElementById('monster-height').innerText = data.height;
                document.getElementById('monster-weight').innerText = data.weight;
                
                document.getElementById('monster-desc').innerHTML = `
                    <strong>常用招式：</strong>${data.moves.join('、')}<br><br>
                    ${data.description}
                `;
            }

            pokedexInfo.style.display = 'block';
            revealBtn.style.display = 'none';
            uploadBtn.style.display = 'block'; 
            uploadBtn.value = ""; 
        });
    </script>
</body>
</html>
